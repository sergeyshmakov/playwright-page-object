version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    allow:
      - dependency-type: "direct"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Production-dep bumps must publish (semantic-release ignores `chore:`), so
    # security fixes to runtime deps reach npm. Dev-dep bumps stay release-free.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-production:
        dependency-type: "production"
      npm-development:
        dependency-type: "development"
    ignore:
      - dependency-name: "@types/node*"
        versions: [ ">=24" ]
      - dependency-name: "lint-staged"
        versions: [ ">=17" ]
      - dependency-name: "typescript"
        versions: [ ">=6" ]
      # @babel/plugin-proposal-decorators >=8 drops the "2023-05" version that
      # matches TypeScript's shipped decorator semantics; "2023-11" breaks
      # parameter-property classes. Stay on v7 for the vitest babel transform.
      - dependency-name: "@babel/plugin-proposal-decorators"
        versions: [ ">=8" ]
      # ts-morph majors bump the vendored TypeScript compiler, which can shift
      # AST semantics under the MCP analysis tools. Review majors manually.
      - dependency-name: "ts-morph"
        versions: [ ">=29" ]
      # commander >=15 requires node >=22.12; this package supports node >=20.
      # Lift when engines.node moves past 22.12.
      - dependency-name: "commander"
        versions: [ ">=15" ]

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    allow:
      - dependency-type: "direct"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docs"
    groups:
      docs-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "lint-staged"
        versions: [ ">=17" ]
      - dependency-name: "typescript"
        versions: [ ">=6" ]

  - package-ecosystem: "npm"
    directory: "/example"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    allow:
      - dependency-type: "direct"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "example"
    groups:
      example-deps:
        patterns:
          - "*"
    ignore:
      # The example demonstrates the library, which supports TypeScript >=5.
      - dependency-name: "typescript"
        versions: [ ">=6" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
