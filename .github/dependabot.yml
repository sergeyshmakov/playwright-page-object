version: 2

# Every ecosystem is capped at one open PR. Grouping already collapses a whole
# ecosystem's bumps into a single PR, so a limit of 1 means at most one review
# at a time and no fan-out of stale branches racing each other onto main.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    allow:
      - dependency-type: "direct"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    # Production-dep bumps must publish (semantic-release ignores `chore:`), so
    # security fixes to runtime deps reach npm. Dev-dep bumps stay release-free.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-production:
        dependency-type: "production"
      npm-development:
        dependency-type: "development"
    ignore:
      - dependency-name: "@types/node*"
        versions: [ ">=24" ]
      - dependency-name: "lint-staged"
        versions: [ ">=17" ]
      - dependency-name: "typescript"
        versions: [ ">=6" ]
      # @babel/plugin-proposal-decorators >=8 drops the "2023-05" version that
      # matches TypeScript's shipped decorator semantics; "2023-11" breaks
      # parameter-property classes. Stay on v7 for the vitest babel transform.
      - dependency-name: "@babel/plugin-proposal-decorators"
        versions: [ ">=8" ]
      # ts-morph majors bump the vendored TypeScript compiler, which can shift
      # AST semantics under the MCP analysis tools. Review majors manually.
      - dependency-name: "ts-morph"
        versions: [ ">=29" ]
      # commander >=15 requires node >=22.12; this package supports node >=20.
      # Lift when engines.node moves past 22.12.
      - dependency-name: "commander"
        versions: [ ">=15" ]

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    allow:
      - dependency-type: "direct"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docs"
    # The docs site ships in no release. Pin the prefix so a production-type dep
    # here can never inherit the release-triggering `fix(deps)` default.
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      docs-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "lint-staged"
        versions: [ ">=17" ]
      - dependency-name: "typescript"
        versions: [ ">=6" ]

  - package-ecosystem: "npm"
    directory: "/example"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    allow:
      - dependency-type: "direct"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "example"
    # react/react-dom are production deps of the example app, so Dependabot's
    # default picks `fix(deps)` and semantic-release cuts a patch release for a
    # change that ships in nothing -- the package publishes `files: ["dist"]`.
    # PR #55 had to be re-subjected by hand; pin the prefix instead.
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      example-deps:
        patterns:
          - "*"
    ignore:
      # The example demonstrates the library, which supports TypeScript >=5.
      - dependency-name: "typescript"
        versions: [ ">=6" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
