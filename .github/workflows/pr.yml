name: PR Check
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Check Formatting & Linting
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test Build
        run: npm run build

      - name: Verify Package
        run: npm run lint:pkg

      - name: Run Tests
        run: npm run test

      - name: Test Example
        run: npm run test:example

      - name: Typecheck Example
        run: npm run typecheck:example

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke Test CLI
        run: npm run test:cli
